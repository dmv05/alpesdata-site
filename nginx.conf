server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Hôte canonique : www -> apex
    if ($host = www.alpesdata.com) {
        return 301 https://alpesdata.com$request_uri;
    }

    # En-têtes de sécurité (toutes les réponses)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri.html $uri/index.html $uri/index.htm $uri/ =404;
    }

    # API proxy vers le backend contact
    location /api/ {
        proxy_pass http://alpesdata-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Redirections 301 anciennes URLs Hostinger → nouvelles (sans équivalent .html direct)
    location = /blog-list { return 301 https://$host/blog.html; }
    location = /nuki-smartlock-20-avec-bridge-serrure-connectee { return 301 https://$host/nuki.html; }
    location = /nuki-smartlock-pro-40-serrure-connectee { return 301 https://$host/nuki.html; }
    location = /page { return 301 https://$host/store.html; }
    location ~ ^/blog/ { return 301 https://$host/blog.html; }

    # Cache long pour les assets (expires n'annule pas les add_header du serveur)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|css|js|woff2?)$ {
        try_files $uri =404;
        expires 30d;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
